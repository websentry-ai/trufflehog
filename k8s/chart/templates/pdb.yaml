{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  # Karpenter drains one node at a time; capping unavailable replicas keeps the
  # service serving (>=1 healthy pod) through a node consolidation/drain, so
  # cross-service calls always land on a Ready pod.
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
{{- end }}

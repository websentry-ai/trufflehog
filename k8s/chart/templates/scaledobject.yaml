{{- if and .Values.keda.enabled .Values.keda.triggers }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "trufflehog.fullname" . }}
  labels:
    app: {{ include "trufflehog.fullname" . }}
spec:
  scaleTargetRef:
    name: {{ include "trufflehog.fullname" . }}   # MUST equal the Deployment metadata.name (templates/deployment.yaml)
  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  pollingInterval: {{ .Values.keda.pollingInterval | default 30 }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod | default 300 }}
  fallback:
    failureThreshold: 3
    replicas: {{ .Values.keda.fallbackReplicas | default .Values.keda.minReplicaCount }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
    {{- toYaml .Values.keda.triggers | nindent 4 }}
{{- end }}

{{- if and .Values.secretData (not .Values.externalSecret.enabled) }}
{{- if .Values.existingSecret }}
{{- fail "trufflehog: set either secretData or existingSecret, not both" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trufflehog.secretName" . }}
  labels:
    app: {{ include "trufflehog.fullname" . }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secretData }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}

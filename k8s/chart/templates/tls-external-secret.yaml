{{- if .Values.tlsExternalSecret.enabled }}
# Sources the ingress TLS cert from AWS Secrets Manager (a Cloudflare Origin CA
# cert) instead of cert-manager, for hosts served behind the Cloudflare proxy
# (Full Strict). The SM entry holds JSON {"tls.crt": ..., "tls.key": ...};
# dataFrom.extract maps them into a kubernetes.io/tls secret named
# ingress.tlsSecretName. When enabled, set ingress.tlsSecretName and drop the
# cert-manager.io/cluster-issuer annotation so cert-manager stops managing it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-origin-tls
  labels:
    app: {{ .Release.Name }}
  annotations:
    # Sync before the Ingress (default wave 0) so nginx never briefly points at a
    # missing secret, which under Cloudflare Full (Strict) surfaces as a 526.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.tlsExternalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ .Values.tlsExternalSecret.secretStoreRef.kind }}
    name: {{ .Values.tlsExternalSecret.secretStoreRef.name }}
  target:
    name: {{ .Values.ingress.tlsSecretName | required "tlsExternalSecret.enabled requires ingress.tlsSecretName" }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  dataFrom:
    - extract:
        key: {{ .Values.tlsExternalSecret.remoteKey | quote }}
{{- end }}

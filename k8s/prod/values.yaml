# Production overlay for the trufflehog-analyzer. Secrets: prod/trufflehog.

image:
  tag: prod

externalSecret:
  enabled: true
  remoteKey: prod/trufflehog
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager

# Public ingress. /analyze is gated by the TRUFFLEHOG_API_KEY bearer token; only
# /health is reachable unauthenticated. className/tls/cluster-issuer are
# inherited from the base values. Requires a Cloudflare DNS record for this host
# pointing at the nginx ingress LB before cert-manager can issue the TLS cert.
ingress:
  enabled: true
  host: trufflehog.getunbound.ai

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 75

# KEDA on prod. Floor 2 (HA), ceiling 4. Scales on scan request rate.
# THRESHOLD "2" scan-rps/pod (prod peaks ~4.3). Near-idle service.
keda:
  enabled: true
  minReplicaCount: 2
  maxReplicaCount: 4
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        query: sum(rate(trufflehog_analyze_requests_total{namespace="prod"}[2m]))
        threshold: "2"

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Non-secret detection-tuning flags, version-controlled here (not in SM).
# The Deployment renders both envFrom: secretRef (SM, supplies TRUFFLEHOG_API_KEY)
# and this env: list; on key collision env: wins, which is what we want for these.
env:
  - name: GENERIC_SECRET_SCORE
    value: "0.8"
  - name: ENTROPY_THRESHOLD
    value: "0.7"
  - name: ENABLE_GENERIC_SECRETS
    value: "false"
  - name: ENABLE_PRIVATE_KEY
    value: "true"
  - name: ENABLE_ENTROPY_PROXIMITY
    value: "true"
  - name: FP_SUPPRESSION_MODE
    value: "enforce"
  - name: VENDOR_STRUCTURAL_SUPPRESSION
    value: "enforce"
# PodDisruptionBudget: keep <=1 replica unavailable so a Karpenter one-at-a-time
# node drain never takes the service below N-1 (cross-service calls stay served).
pdb:
  enabled: true
  maxUnavailable: 1

# Staging overlay for the trufflehog-analyzer. Secrets: staging/trufflehog.

image:
  tag: staging

externalSecret:
  remoteKey: staging/trufflehog

# Public ingress. /analyze is gated by the TRUFFLEHOG_API_KEY bearer token; only
# /health is reachable unauthenticated. className/tls/cluster-issuer are
# inherited from the base values. Requires a Cloudflare DNS record for this host
# pointing at the nginx ingress LB before cert-manager can issue the TLS cert.
ingress:
  enabled: true
  host: trufflehog-staging.unboundsecurity.ai
  # Served behind the Cloudflare proxy (Full Strict): the origin cert is a
  # Cloudflare Origin CA cert delivered by ESO from AWS SM (tlsExternalSecret
  # below) into trufflehog-staging-origin-tls, NOT the cert-manager -tls secret.
  # Null-ing the cluster-issuer annotation stops cert-manager managing it.
  tlsSecretName: trufflehog-staging-origin-tls
  annotations:
    cert-manager.io/cluster-issuer: null

# Origin CA cert pulled from AWS SM (staging/eks-origin-tls, shared multi-SAN)
# by ESO into trufflehog-staging-origin-tls. Mirrors the unbound-fe pattern.
tlsExternalSecret:
  enabled: true
  remoteKey: staging/eks-origin-tls

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 75

# KEDA on staging only. This suppresses the HPA above (including its memory
# metric) and scales via the ScaledObject instead. This near-idle service's win
# is the min-1 floor + KEDA-managed scaling. Scales on the real scan-job-rate
# metric (trufflehog_analyze_requests_total, incremented once per /analyze scan
# in cmd/analyzer/main.go). Prod keeps its HPA.
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 2
  triggers:
    # Scale on scan/request rate. THRESHOLD "2" per pod is a PLACEHOLDER (near-idle
    # service) — CALIBRATE vs real peak in Grafana before prod.
    # trufflehog_analyze_requests_total is a CounterVec created lazily on the first
    # /analyze request, so the series is absent until traffic flows; KEDA's fallback
    # (3 failures -> minReplicaCount) covers the no-data window.
    - type: prometheus
      metadata:
        serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        query: sum(rate(trufflehog_analyze_requests_total{namespace="staging"}[2m]))
        threshold: "2"

# Prometheus must scrape /metrics for the KEDA prometheus trigger above to have
# data. Inherited from base values (enabled: true) but pinned here explicitly
# since the ScaledObject query depends on it. The cluster's kube-prometheus-stack
# runs serviceMonitorSelectorNilUsesHelmValues=false, so no release label needed.
serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

env:
  - name: GENERIC_SECRET_SCORE
    value: "0.8"
  - name: ENTROPY_THRESHOLD
    value: "0.7"
  - name: ENABLE_GENERIC_SECRETS
    value: "false"
  - name: ENABLE_PRIVATE_KEY
    value: "true"
  - name: ENABLE_ENTROPY_PROXIMITY
    value: "true"
  - name: FP_SUPPRESSION_MODE
    value: "enforce"
  - name: VENDOR_STRUCTURAL_SUPPRESSION
    value: "enforce"
    
# Staging: retire old ReplicaSets quickly.
revisionHistoryLimit: 2

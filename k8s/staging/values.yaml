# Staging overlay for the trufflehog-analyzer. Secrets: staging/trufflehog.

image:
  tag: staging

externalSecret:
  remoteKey: staging/trufflehog

# Public ingress. /analyze is gated by the TRUFFLEHOG_API_KEY bearer token; only
# /health is reachable unauthenticated. className/tls/cluster-issuer are
# inherited from the base values. Requires a Cloudflare DNS record for this host
# pointing at the nginx ingress LB before cert-manager can issue the TLS cert.
ingress:
  enabled: true
  host: trufflehog-staging.getunbound.ai

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 75

# KEDA on staging only. This suppresses the HPA above (including its memory
# metric) and scales via the ScaledObject instead. This near-idle service's win
# is the min-1 floor + KEDA-managed scaling; the CPU trigger is an INTERIM stand-in
# until the real scan-job-rate metric is exposed (follow-up). Prod keeps its HPA.
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 2
  triggers:
    # INTERIM CPU trigger — real scan-job-rate metric is a follow-up.
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

env:
  - name: GENERIC_SECRET_SCORE
    value: "0.8"
  - name: ENTROPY_THRESHOLD
    value: "0.7"
  - name: ENABLE_GENERIC_SECRETS
    value: "false"
  - name: ENABLE_PRIVATE_KEY
    value: "true"
  - name: ENABLE_ENTROPY_PROXIMITY
    value: "true"
  - name: FP_SUPPRESSION_MODE
    value: "enforce"
  - name: VENDOR_STRUCTURAL_SUPPRESSION
    value: "enforce"
    
# Staging: retire old ReplicaSets quickly.
revisionHistoryLimit: 2

name: Analyzer regression tests

on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'cmd/analyzer/**'
      - 'pkg/detectors/**'
      - 'pkg/engine/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/analyzer-regression.yml'

permissions:
  contents: read

jobs:
  analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go test ./cmd/analyzer/...

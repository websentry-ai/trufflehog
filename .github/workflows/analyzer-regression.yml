name: Analyzer regression tests

on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'cmd/analyzer/**'
      - 'pkg/detectors/**'
      - 'pkg/engine/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/analyzer-regression.yml'

permissions:
  contents: read

jobs:
  analyzer:
    if: ${{ !startsWith(github.head_ref, 'codex/dlp-enhancer-') && !startsWith(github.head_ref, 'codex/web-6913-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go test ./cmd/analyzer/...


  isolated-analyzer:
    if: startsWith(github.head_ref, 'codex/dlp-enhancer-') || startsWith(github.head_ref, 'codex/web-6913-')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare modules from the trusted PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/base-modules"
          git archive "$BASE_SHA" go.mod go.sum | tar -x -C "$RUNNER_TEMP/base-modules"
          docker build -f - -t enhancer-go-tests "$RUNNER_TEMP/base-modules" <<'DOCKERFILE'
          FROM golang:1.26-bookworm
          WORKDIR /modules
          COPY go.mod go.sum ./
          RUN go mod download
          DOCKERFILE
      - name: Run analyzer regressions offline
        run: |
          set -euo pipefail
          mkdir -m 755 "$RUNNER_TEMP/candidate"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/candidate"
          docker run --rm --network none --user 65534:65534 --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 512 --log-driver none \
            --mount "type=bind,src=$RUNNER_TEMP/candidate,dst=/source,readonly" \
            --workdir /source --env HOME=/tmp --env GOCACHE=/tmp/build-cache \
            --env GOPROXY=off --env GOSUMDB=off --env CGO_ENABLED=0 --env GOTOOLCHAIN=local \
            enhancer-go-tests go test -count=1 -mod=readonly -p=2 ./cmd/analyzer/... >/dev/null 2>&1
          echo 'Isolated analyzer regression tests passed.'
